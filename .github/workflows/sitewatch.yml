name: sitewatch

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

# Needed so the job can commit the refreshed dashboard data back to the repo.
permissions:
  contents: write

concurrency:
  group: sitewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Never fails here: the data has to be written and committed even when a
      # site is down. Whether this run counts as a failure is decided last.
      #
      # SITEWATCH_PROBE_URL is a repository *variable*, the token a *secret*.
      # With neither set the probe is skipped and the run works exactly as before.
      - name: Run checks
        env:
          SITEWATCH_PROBE_TOKEN: ${{ secrets.SITEWATCH_PROBE_TOKEN }}
          PROBE_URL: ${{ vars.SITEWATCH_PROBE_URL }}
        run: |
          PROBE_ARGS=""
          if [ -n "$PROBE_URL" ]; then
            PROBE_ARGS="--probe sin1=$PROBE_URL"
            echo "Folding in the sin1 vantage point."
          else
            echo "No SITEWATCH_PROBE_URL set — checking from this runner only."
          fi
          python sitewatch.py --out docs --alert-payload alert.json \
                 --fail-on never $PROBE_ARGS

      - name: Commit dashboard data
        run: |
          git config user.name  "sitewatch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/history.json docs/events.json docs/rdap-cache.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "sitewatch: status $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      # Optional. Add a SITEWATCH_WEBHOOK_URL secret (Slack, Discord or
      # Mattermost incoming webhook) and alerts arrive in seconds instead of
      # waiting on GitHub's failed-run email.
      - name: Send alert to webhook
        if: hashFiles('alert.json') != ''
        env:
          WEBHOOK: ${{ secrets.SITEWATCH_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No SITEWATCH_WEBHOOK_URL secret set — skipping."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
               --data @alert.json "$WEBHOOK" > /dev/null
          echo "Alert posted."

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewatch-result
          path: |
            docs/status.json
            alert.json
          retention-days: 7
          if-no-files-found: warn

      # Fails on a new outage, and again every 12 hours while one continues —
      # not on all 48 runs of a bad day, which is how alerting gets ignored.
      # Recoveries and warnings notify without failing the run.
      - name: Fail on outage
        if: hashFiles('alert.json') != ''
        run: |
          python - <<'PY'
          import json, sys
          a = json.load(open("alert.json"))
          for line in a["alerts"]:
              level = "error" if line.startswith("DOWN") else "warning"
              print(f"::{level} title=sitewatch::{line}")
          sys.exit(1 if a["severity"] == "down" else 0)
          PY
