name: sitewatch

# Dispatch only. The schedule is owned by Vercel Cron (probe/api/tick.js), which
# fires on the half hour; GitHub's own cron is deprioritised on free accounts and
# was measured firing once in six hours against Vercel's twelve. Restoring a
# `schedule:` block here would add unreliable duplicate runs on top of reliable
# ones, not a safety net.
on:
  workflow_dispatch: {}       # Vercel Cron, and the Actions tab's Run workflow

# Needed so the job can commit the refreshed dashboard data back to the repo.
permissions:
  contents: write

concurrency:
  group: sitewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Never fails here: the data has to be written and committed even when a
      # site is down. Whether this run counts as a failure is decided last.
      #
      # Vantage points come from repository *variables*, the shared token from a
      # *secret*. Adding a region is editing SITEWATCH_PROBES — never this file:
      #
      #   SITEWATCH_PROBES         sin1=https://a.vercel.app/api/probe,
      #                            iad1=https://b.vercel.app/api/probe
      #   SITEWATCH_PROBE_PRIMARY  sin1        (optional; defaults to the first)
      #
      # With none of them set the probes are skipped and the run works exactly
      # as it did before any of this existed.
      - name: Run checks
        env:
          SITEWATCH_PROBE_TOKEN: ${{ secrets.SITEWATCH_PROBE_TOKEN }}
          PROBES: ${{ vars.SITEWATCH_PROBES }}
          PROBE_PRIMARY: ${{ vars.SITEWATCH_PROBE_PRIMARY }}
        run: |
          PROBE_ARGS=""
          PRIMARY=""

          LIST="$PROBES"

          for spec in $(printf '%s' "$LIST" | tr ',' ' '); do
            case "$spec" in
              *=*)
                PROBE_ARGS="$PROBE_ARGS --probe $spec"
                [ -z "$PRIMARY" ] && PRIMARY="${spec%%=*}"
                ;;
              *)
                echo "::warning::ignoring probe spec '$spec' — expected NAME=URL"
                ;;
            esac
          done

          # The headline latency is one region's. This runner is in the US or
          # Europe, so a site served from Singapore is three round trips of
          # ocean away before it does any work — a number that describes the
          # runner's distance, not the audience's experience, and one that trips
          # the slow threshold on sites that are in fact fast. Every other
          # vantage is still recorded per row, and the runner's own reading is
          # kept as runner_ms.
          [ -n "$PROBE_PRIMARY" ] && PRIMARY="$PROBE_PRIMARY"

          if [ -n "$PROBE_ARGS" ]; then
            PROBE_ARGS="$PROBE_ARGS --probe-primary $PRIMARY"
            echo "Vantages:$PROBE_ARGS"
          else
            echo "No SITEWATCH_PROBES set — checking from this runner only."
            echo "Latency will reflect US/EU distance, not Malaysian visitors."
          fi
          python sitewatch.py --out docs --alert-payload alert.json \
                 --fail-on never $PROBE_ARGS

      - name: Commit dashboard data
        run: |
          git config user.name  "sitewatch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/history.json docs/events.json docs/rdap-cache.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "sitewatch: status $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      # Optional. Add a SITEWATCH_WEBHOOK_URL secret (Slack, Discord or
      # Mattermost incoming webhook) and alerts arrive in seconds instead of
      # waiting on GitHub's failed-run email.
      - name: Send alert to webhook
        if: hashFiles('alert.json') != ''
        env:
          WEBHOOK: ${{ secrets.SITEWATCH_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No SITEWATCH_WEBHOOK_URL secret set — skipping."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
               --data @alert.json "$WEBHOOK" > /dev/null
          echo "Alert posted."

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewatch-result
          path: |
            docs/status.json
            alert.json
          retention-days: 7
          if-no-files-found: warn

      # Fails on a new outage, and again every 12 hours while one continues —
      # not on all 48 runs of a bad day, which is how alerting gets ignored.
      # Recoveries and warnings notify without failing the run.
      - name: Fail on outage
        if: hashFiles('alert.json') != ''
        run: |
          python - <<'PY'
          import json, sys
          a = json.load(open("alert.json"))
          for line in a["alerts"]:
              level = "error" if line.startswith("DOWN") else "warning"
              print(f"::{level} title=sitewatch::{line}")
          sys.exit(1 if a["severity"] == "down" else 0)
          PY
