<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Uptime and TLS certificate status for every domain in domains.txt, rechecked every 30 minutes.">
<title>sitewatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%231b4e6b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275.5%27 fill=%27%2334d399%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  /* ---- tokens: light is the complete set ------------------------------- */
  :root {
    color-scheme: light;
    --ground:      #eef1f5;
    --surface:     #ffffff;
    --surface-2:   #f6f8fa;
    --hairline:    #dbe1e8;
    --hairline-2:  #eaeef3;
    --ink:         #141c24;
    --ink-2:       #47555f;
    --ink-3:       #6d7d8b;

    --accent:      #1b4e6b;
    --accent-soft: #e4eef4;

    --up:          #0f7a56;
    --up-soft:     #e2f2ea;
    --warn:        #c08a00;
    --warn-soft:   #f8efd8;
    --down:        #c22e28;
    --down-soft:   #fae7e5;

    --shadow: 0 1px 2px rgba(20, 28, 36, .05), 0 8px 24px -16px rgba(20, 28, 36, .28);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:      #0e141a;
      --surface:     #151d25;
      --surface-2:   #1b242d;
      --hairline:    #26313c;
      --hairline-2:  #1f2831;
      --ink:         #e3eaf1;
      --ink-2:       #a9b8c5;
      --ink-3:       #7d8d9c;

      --accent:      #6fb3d9;
      --accent-soft: #17303f;

      --up:          #2fcb8e;
      --up-soft:     #10322a;
      --warn:        #f0c24a;
      --warn-soft:   #33290f;
      --down:        #ff5f52;
      --down-soft:   #3a1a1a;

      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -18px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:      #0e141a;
    --surface:     #151d25;
    --surface-2:   #1b242d;
    --hairline:    #26313c;
    --hairline-2:  #1f2831;
    --ink:         #e3eaf1;
    --ink-2:       #a9b8c5;
    --ink-3:       #7d8d9c;

    --accent:      #6fb3d9;
    --accent-soft: #17303f;

    --up:          #2fcb8e;
    --up-soft:     #10322a;
    --warn:        #f0c24a;
    --warn-soft:   #33290f;
    --down:        #ff5f52;
    --down-soft:   #3a1a1a;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -18px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 22px 72px; }

  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tnum { font-variant-numeric: tabular-nums; }

  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3);
  }

  /* ---- topbar ---------------------------------------------------------- */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .brand h1 {
    margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.015em;
  }
  .brand .tag { font-size: 12.5px; color: var(--ink-3); }

  .beacon {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--up); align-self: center;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 55%, transparent);
    animation: ping 2.6s ease-out infinite;
  }
  .beacon[data-state="warn"] { background: var(--warn); box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent); }
  .beacon[data-state="down"] { background: var(--down); box-shadow: 0 0 0 0 color-mix(in srgb, var(--down) 55%, transparent); }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 currentColor; }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .btn {
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 7px;
    padding: 6px 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s, color .15s, background .15s;
  }
  .btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .source {
    font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .source[data-live="false"] { background: var(--warn-soft); color: var(--warn); }

  /* ---- verdict --------------------------------------------------------- */
  .verdict {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 30px 28px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 34px; align-items: center;
  }
  .verdict h2 {
    margin: 8px 0 0; font-size: 36px; font-weight: 600;
    letter-spacing: -.03em; line-height: 1.12; text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 720px) { .verdict h2 { font-size: 29px; } }
  .verdict .sub { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; }
  .verdict .sub b { font-weight: 600; color: var(--ink); }

  .trend { min-width: 0; }
  .trend-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; margin-bottom: 6px;
  }
  .trend svg { display: block; width: 100%; height: 62px; overflow: visible; }

  /* ---- readouts -------------------------------------------------------- */
  .readouts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(192px, 1fr));
    gap: 12px; margin: 12px 0 26px;
  }
  .tile {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); padding: 14px 16px 15px;
  }
  .tile .figure {
    font-size: 27px; font-weight: 600; letter-spacing: -.02em;
    line-height: 1.15; margin-top: 7px;
  }
  .tile .figure .unit { font-size: 15px; font-weight: 500; color: var(--ink-3); }
  .tile .note {
    font-size: 12px; color: var(--ink-3); margin-top: 4px;
    overflow-wrap: anywhere; line-height: 1.45;
  }

  /* ---- controls -------------------------------------------------------- */
  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .search {
    flex: 1 1 220px; min-width: 0;
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 7px; padding: 7px 12px;
  }
  .search::placeholder { color: var(--ink-3); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .btn[aria-pressed="true"] {
    background: var(--accent-soft); color: var(--accent); border-color: transparent;
  }
  select.btn { padding-right: 8px; }

  /* ---- ledger ---------------------------------------------------------- */
  .ledger {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .lrow {
    display: grid;
    grid-template-columns: 104px minmax(180px, 1fr) 178px 128px 132px;
    gap: 18px; align-items: center;
    padding: 13px 20px;
    border-top: 1px solid var(--hairline-2);
  }
  .lhead {
    border-top: 0; padding-top: 11px; padding-bottom: 11px;
    background: var(--surface-2);
  }
  .lhead > * { font-size: 11px; font-weight: 600; letter-spacing: .09em;
               text-transform: uppercase; color: var(--ink-3); }
  .lrow.site:hover { background: var(--surface-2); }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px 4px 7px; border-radius: 999px;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .chip[data-s="up"]   { color: var(--up);   background: var(--up-soft); }
  .chip[data-s="warn"] { color: var(--warn); background: var(--warn-soft); }
  .chip[data-s="down"] { color: var(--down); background: var(--down-soft); }

  .site-name { min-width: 0; }
  .site-name a {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px; font-weight: 500; color: var(--ink);
    text-decoration: none; border-bottom: 1px solid transparent;
  }
  .site-name a:hover { border-bottom-color: var(--ink-3); }
  .site-name a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .site-note {
    font-size: 12.5px; color: var(--ink-3); margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .site-note[data-s="down"] { color: var(--down); }
  .site-note[data-s="warn"] { color: var(--warn); }

  .checks { min-width: 0; }
  .strip { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
  .availability { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; }
  .availability b { font-weight: 500; color: var(--ink-2); }
  .bar { width: 4px; border-radius: 2px; flex: none; background: var(--hairline); }
  .bar[data-s="up"]   { background: var(--up); }
  .bar[data-s="warn"] { background: var(--warn); }
  .bar[data-s="down"] { background: var(--down); }
  .bar:hover { filter: brightness(1.15); }
  .strip-empty { font-size: 12px; color: var(--ink-3); align-self: center; }
  .latency .val.muted { color: var(--ink-3); }

  .latency { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .latency-main { display: flex; align-items: center; gap: 9px; }
  .vantage {
    font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .vantage .where {
    font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); align-self: center;
  }
  .vantage b { font-weight: 500; color: var(--ink-2); }
  .vantage[data-failed="true"] b { color: var(--warn); }

  .probe-note {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; padding: 9px 14px;
    background: var(--warn-soft); color: var(--warn);
    border-radius: 8px; font-size: 13px;
  }
  .probe-note b { font-weight: 600; }
  /* display:flex above would otherwise beat the UA rule for [hidden] */
  .probe-note[hidden] { display: none; }
  .latency .val { font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  .latency svg { display: block; overflow: visible; }

  .cert { min-width: 0; }
  .cert-top {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; font-size: 13px; margin-bottom: 5px;
  }
  .cert-top .days { font-weight: 500; }
  .cert-top .issuer {
    font-size: 11.5px; color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meter { height: 4px; border-radius: 2px; background: var(--hairline); overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 2px; background: var(--up); }
  .meter[data-s="warn"] > i { background: var(--warn); }
  .meter[data-s="down"] > i { background: var(--down); }
  .cert.none { color: var(--ink-3); font-size: 13px; }

  .empty { padding: 34px 20px; text-align: center; color: var(--ink-3); font-size: 14px; }

  /* ---- change log ------------------------------------------------------ */
  .changes { margin-top: 26px; }
  .changes h3 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .changes ol {
    list-style: none; margin: 0; padding: 0;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); overflow: hidden;
  }
  .changes li {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 10px 20px; border-top: 1px solid var(--hairline-2); font-size: 13.5px;
  }
  .changes li:first-child { border-top: 0; }
  .changes .when { margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .changes .arrow { font-size: 12px; color: var(--ink-3); }
  .changes .to { font-weight: 600; }
  .changes .to[data-s="up"]   { color: var(--up); }
  .changes .to[data-s="warn"] { color: var(--warn); }
  .changes .to[data-s="down"] { color: var(--down); }
  .changes .why { color: var(--ink-3); font-size: 12.5px; }

  /* ---- footer ---------------------------------------------------------- */
  footer {
    margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--hairline);
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--ink-3);
  }
  footer b { font-weight: 600; color: var(--ink-2); }

  /* ---- tooltip --------------------------------------------------------- */
  #tip {
    position: fixed; z-index: 40; pointer-events: none;
    background: var(--ink); color: var(--ground);
    border-radius: 6px; padding: 6px 9px;
    font-size: 12px; line-height: 1.45; white-space: nowrap;
    opacity: 0; transition: opacity .12s; box-shadow: var(--shadow);
  }
  #tip[data-show="true"] { opacity: 1; }
  #tip .k { opacity: .7; }

  @media (max-width: 900px) {
    .verdict { grid-template-columns: minmax(0, 1fr); }
    .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lrow { grid-template-columns: 96px minmax(0, 1fr) 140px; }
    .lrow > .latency, .lrow > .cert { grid-column: 2 / -1; }
    .lhead { display: none; }
    .lrow.site { row-gap: 10px; padding: 15px 16px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 20px 14px 56px; }
    .lrow { grid-template-columns: minmax(0, 1fr); }
    .lrow > * { grid-column: 1 / -1 !important; }
    .verdict h2 { font-size: 23px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="beacon" id="beacon"></span>
      <h1>sitewatch</h1>
      <span class="tag" id="tag">checked every 30 minutes</span>
    </div>
    <span class="source" id="source">live</span>
    <button class="btn" id="theme" type="button" aria-label="Switch theme">Theme</button>
  </div>

  <section class="verdict">
    <div>
      <p class="eyebrow" id="checked">—</p>
      <h2 id="headline">Loading checks…</h2>
      <p class="sub" id="subline"></p>
    </div>
    <div class="trend">
      <div class="trend-head">
        <span class="eyebrow">Median response</span>
        <span class="eyebrow tnum" id="trend-range"></span>
      </div>
      <div id="trend"></div>
    </div>
  </section>

  <div class="readouts" id="readouts"></div>

  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Filter by domain…" aria-label="Filter by domain">
    <button class="btn" id="issues" type="button" aria-pressed="false">Only issues</button>
    <select class="btn" id="sort" aria-label="Sort sites">
      <option value="severity">Sort: worst first</option>
      <option value="name">Sort: domain</option>
      <option value="latency">Sort: slowest</option>
      <option value="cert">Sort: cert expiring</option>
    </select>
  </div>

  <div class="probe-note" id="probe-note" hidden></div>

  <div class="ledger">
    <div class="lrow lhead">
      <div>Status</div><div>Site</div><div>Recent checks</div><div>Response</div><div>Certificate</div>
    </div>
    <div id="rows"></div>
  </div>

  <section class="changes" id="changes" hidden>
    <h3>Recent changes</h3>
    <ol id="changelist"></ol>
  </section>

  <footer>
    <span>Down means the check failed outright. <b>Warning</b> means it answered but something needs a look — a bot-block, an expiring certificate, or a slow reply.</span>
    <span id="runs-note"></span>
  </footer>
</div>

<div id="tip" role="tooltip"></div>

<script>
(() => {
  "use strict";

  const LABEL = { up: "Up", warn: "Warning", down: "Down" };
  const RANK  = { down: 0, warn: 1, up: 2 };
  const SLOTS = 28;          // most recent checks drawn per site
  const CERT_CYCLE = 90;     // Let's Encrypt issues 90-day certs; meter is days/90

  const state = { status: null, history: { runs: [] }, events: [], live: false,
                  q: "", onlyIssues: false, sort: "severity" };

  const $  = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- theme --------------------------------------------------------- */
  const forced = new URLSearchParams(location.search).get("theme");
  if (forced === "dark" || forced === "light") {
    document.documentElement.setAttribute("data-theme", forced);
  } else {
    try {
      const saved = localStorage.getItem("sitewatch-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage blocked; system theme still applies */ }
  }

  $("#theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme")
      ? root.getAttribute("data-theme") === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("sitewatch-theme", next); } catch (e) { /* ignore */ }
    render();
  });

  /* ---- tooltip ------------------------------------------------------- */
  const tip = $("#tip");
  function showTip(evt, html) {
    tip.innerHTML = html;
    tip.dataset.show = "true";
    const pad = 12, r = tip.getBoundingClientRect();
    let x = evt.clientX + pad, y = evt.clientY - r.height - pad;
    if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
    if (y < 8) y = evt.clientY + pad;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  const hideTip = () => { tip.dataset.show = "false"; };
  document.addEventListener("scroll", hideTip, true);

  /* ---- time ---------------------------------------------------------- */
  function ago(iso) {
    const secs = (Date.now() - new Date(iso).getTime()) / 1000;
    if (!isFinite(secs)) return "—";
    if (secs < 90) return "just now";
    const mins = Math.round(secs / 60);
    if (mins < 60) return mins + " min ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    const days = Math.round(hrs / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }
  const clock = (iso) => new Date(iso).toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

  /* ---- data ---------------------------------------------------------- */
  async function load() {
    try {
      const [s, h, e] = await Promise.all([
        fetch("./status.json",  { cache: "no-store" }).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
        fetch("./history.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : { runs: [] })
                                                      .catch(() => ({ runs: [] })),
        fetch("./events.json",  { cache: "no-store" }).then((r) => r.ok ? r.json() : { events: [] })
                                                      .catch(() => ({ events: [] })),
      ]);
      state.status = s;
      state.history = h && Array.isArray(h.runs) ? h : { runs: [] };
      state.events = e && Array.isArray(e.events) ? e.events : [];
      state.live = true;
    } catch (e) {
      // No server to fetch from (opened as a file, or published standalone):
      // fall back to the snapshot baked into the page and say so.
      const boot = JSON.parse($("#bootstrap").textContent);
      state.status = boot.status;
      state.history = boot.history && Array.isArray(boot.history.runs) ? boot.history : { runs: [] };
      state.events = Array.isArray(boot.events) ? boot.events : [];
      state.live = false;
    }
    render();
  }

  // A site that answers but warns is still serving people; only a failed
  // check counts against availability.
  const avail = (runs) => {
    const ok = runs.filter((r) => r.s !== "down").length;
    const pct = (ok / runs.length) * 100;
    return (pct === 100 ? "100" : pct.toFixed(1)) + "%";
  };

  // Fleet uptime across every recorded check. The per-row figure has always
  // existed; this is the same arithmetic over the whole history, and it is the
  // number a status page is actually judged on — a snapshot says nothing about
  // whether the thing is dependable.
  const fleetUptime = () => {
    let ok = 0, total = 0;
    for (const run of state.history.runs) {
      for (const v of Object.values(run.sites || {})) {
        total++;
        if (v.s !== "down") ok++;
      }
    }
    if (!total) return null;
    const pct = (ok / total) * 100;
    return { pct, total, label: (pct === 100 ? "100" : pct.toFixed(2)) + "%" };
  };

  // Time since the last transition *into* down. Recoveries and warnings are
  // not incidents; counting them would make the streak reset on good news.
  const sinceIncident = () => {
    const last = [...state.events].reverse().find((e) => e.to === "down");
    const from = last ? Date.parse(last.t) : Date.parse(state.history.runs[0]?.t || "");
    if (!Number.isFinite(from)) return null;
    const days = Math.floor((Date.now() - from) / 86400000);
    return { days, ever: Boolean(last) };
  };

  // sin1 is a Vercel region code. The claim being made is geographic, so say
  // the place — an unfamiliar code reads as noise to anyone being shown this.
  const PLACES = {
    sin1: "Singapore", hkg1: "Hong Kong", syd1: "Sydney", bom1: "Mumbai",
    hnd1: "Tokyo", icn1: "Seoul", iad1: "Washington", sfo1: "San Francisco",
    cle1: "Cleveland", pdx1: "Portland", gru1: "São Paulo", cdg1: "Paris",
    dub1: "Dublin", fra1: "Frankfurt", lhr1: "London", arn1: "Stockholm",
    kul: "Kuala Lumpur",
  };
  const place = (code) => PLACES[code] || code;

  const median = (xs) => {
    const v = xs.filter((n) => typeof n === "number").sort((a, b) => a - b);
    if (!v.length) return null;
    const mid = Math.floor(v.length / 2);
    return v.length % 2 ? v[mid] : Math.round((v[mid - 1] + v[mid]) / 2);
  };

  const runsFor = (domain) => state.history.runs
    .map((r) => ({ t: r.t, ...(r.sites || {})[domain] }))
    .filter((r) => r.s);

  /* ---- charts -------------------------------------------------------- */
  // Response-time sparkline: 2px line, faint area fill, emphasized endpoint.
  function sparkline(points, color, w, h) {
    const vals = points.map((p) => p.ms).filter((v) => typeof v === "number");
    if (vals.length < 2) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const x = (i) => (i / (vals.length - 1)) * w;
    const y = (v) => h - 2 - ((v - lo) / span) * (h - 4);
    const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const area = `${line}L${w},${h}L0,${h}Z`;
    const id = "g" + Math.random().toString(36).slice(2, 8);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}"
              r="3" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    </svg>`;
  }

  // Fleet median-response trend, with a crosshair readout on hover.
  function renderTrend() {
    const host = $("#trend");
    // A median over a different set of sites is not comparable to the one
    // beside it. Runs predating the current list keep only the sites that
    // survived into it, so a run left holding a couple of rows would plot a
    // point about those rows and nothing else. Per-site sparklines are
    // unaffected — they read one domain at a time, and every run still has
    // that domain's own reading.
    const fleet = Math.max(1, Math.round(
      (state.status.sites || []).length * 0.6));
    const series = state.history.runs.map((r) => {
      const ms = Object.values(r.sites || {})
        .map((v) => v.ms).filter((v) => typeof v === "number" && v > 0).sort((a, b) => a - b);
      if (ms.length < fleet) return null;
      const mid = Math.floor(ms.length / 2);
      return { t: r.t, v: ms.length % 2 ? ms[mid] : Math.round((ms[mid - 1] + ms[mid]) / 2) };
    }).filter(Boolean);

    $("#trend-range").textContent = series.length
      ? series.length + (series.length === 1 ? " check" : " checks") : "";

    if (series.length < 2) {
      host.innerHTML = `<p style="margin:0;font-size:13px;color:var(--ink-3)">`
        + (series.length ? `${series[0].v} ms — the trend line appears once a second check has run.`
                         : `No checks recorded yet.`) + `</p>`;
      return;
    }

    const w = 300, h = 62, ink = "var(--accent)";
    const vals = series.map((p) => p.v);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const x = (i) => (i / (series.length - 1)) * w;
    const y = (v) => h - 6 - ((v - lo) / span) * (h - 14);
    const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");

    host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"
        role="img" aria-label="Median response time across the last ${series.length} checks">
      <line x1="0" y1="${h - 1}" x2="${w}" y2="${h - 1}" stroke="var(--hairline)" stroke-width="1"/>
      <defs><linearGradient id="trendfill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${ink}" stop-opacity=".2"/>
        <stop offset="100%" stop-color="${ink}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${line}L${w},${h}L0,${h}Z" fill="url(#trendfill)"/>
      <path d="${line}" fill="none" stroke="${ink}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${x(series.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}"
              r="3.5" fill="${ink}" stroke="var(--surface)" stroke-width="2"
              vector-effect="non-scaling-stroke"/>
      <rect x="0" y="0" width="${w}" height="${h}" fill="transparent"/>
    </svg>`;

    const svg = host.querySelector("svg");
    svg.addEventListener("mousemove", (evt) => {
      const box = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(series.length - 1,
        Math.round(((evt.clientX - box.left) / box.width) * (series.length - 1))));
      showTip(evt, `<b>${series[i].v} ms</b> median<br><span class="k">${esc(clock(series[i].t))}</span>`);
    });
    svg.addEventListener("mouseleave", hideTip);
  }

  /* ---- render -------------------------------------------------------- */
  function render() {
    const s = state.status;
    if (!s) {
      $("#headline").textContent = "No status data yet";
      $("#subline").textContent = "Run python sitewatch.py --out docs to produce the first snapshot.";
      $("#rows").innerHTML = `<div class="empty">Nothing to show yet.</div>`;
      return;
    }

    const c = s.counts, bad = c.down + c.warn;

    $("#source").textContent = state.live ? "live" : "snapshot";
    $("#source").dataset.live = String(state.live);
    $("#beacon").dataset.state = s.overall;
    $("#tag").textContent = `${s.total} properties, checked every 30 minutes`;
    $("#checked").textContent = `Checked ${ago(s.generated_at)} · ${clock(s.generated_at)}`;

    // When something is wrong, the problem leads — a track record is no comfort
    // mid-incident. When nothing is wrong, "all 8 up" is only a fact about this
    // minute, so the headline carries the figure that actually earns trust.
    const up = fleetUptime();
    const streak = sinceIncident();
    const clean = !c.down && !c.warn;

    $("#headline").textContent =
      c.down ? `${c.down} of ${s.total} sites ${c.down === 1 ? "is" : "are"} down`
      : c.warn ? `${c.warn} of ${s.total} sites need${c.warn === 1 ? "s" : ""} a look`
      : up ? `${up.label} uptime`
      : `All ${s.total} sites are up`;

    const worst = s.sites.filter((x) => x.status !== "up").map((x) => x.domain);
    // Measured from the last outage, or from the start of records when there has
    // never been one — "no incident on record" reads as *not watching*, which is
    // the opposite of the claim. Below a day, say so rather than "in 0 days".
    const streakText = !streak ? null
      : streak.days >= 1
        ? `no incidents in ${streak.days} day${streak.days === 1 ? "" : "s"}`
        : `no incidents today`;
    $("#subline").innerHTML = worst.length
      ? `Needs attention: ` + worst.map((d) => `<b>${esc(d)}</b>`).join(", ") + `.`
      : clean && up
        ? [`<b>${s.total}</b> sites`, `<b>${up.total.toLocaleString()}</b> checks`, streakText]
            .filter(Boolean).join(" · ")
        : `Every domain answered, every certificate is valid.`;

    // readouts
    const upSites = s.sites.filter((x) => x.status === "up" && typeof x.ms === "number");
    const fleetMedian = median(upSites.map((x) => x.ms));
    // The checker runs from GitHub's US/EU runners; a probe deployed near the
    // audience is the reading that actually reflects their experience. When one
    // has been promoted, the median above is already that probe's, so the note
    // reports each probe's *warm* median instead — the same number minus the
    // cold start, which is what the sites do when someone is actually using them.
    const promoted = (s.sites.find((x) => x.ms_from) || {}).ms_from || null;
    // The contrast is the interesting part and is normally invisible: almost no
    // status page says where it measured from, and these two vantages disagree
    // by 3x on identical requests. Name both, and the number stops being a bare
    // figure and becomes a claim about a specific audience.
    const warmMedian = promoted
      ? median(s.sites.map((x) => (x.vantages || {})[promoted])
                      .filter((v) => v && !v.error).map((v) => v.warm_ms))
      : null;
    const runnerMedian = median(s.sites.map((x) => x.runner_ms));

    const latencyNote = promoted
      ? [warmMedian !== null ? `${warmMedian} ms warm` : null,
         runnerMedian !== null ? `${runnerMedian} ms from US` : null]
          .filter(Boolean).join(" · ")
      : Object.keys(s.probes || {}).map((name) => {
          const m = median(s.sites.map((x) => (x.vantages || {})[name])
                                  .filter((v) => v && !v.error).map((v) => v.ms));
          return m === null ? null : `${place(name)} ${m} ms`;
        }).filter(Boolean).join(" · ");

    const certs = s.sites.filter((x) => typeof x.ssl_days_left === "number")
                         .sort((a, b) => a.ssl_days_left - b.ssl_days_left);
    const soonest = certs[0];
    const regs = s.sites.filter((x) => typeof x.domain_days_left === "number")
                        .sort((a, b) => a.domain_days_left - b.domain_days_left);
    const renewal = regs[0];
    const unknown = s.sites.filter((x) => x.domain_rdap === false).length;

    $("#readouts").innerHTML = [
      { label: "Operational", figure: `${c.up}<span class="unit"> / ${s.total}</span>`,
        note: "responding normally" },
      { label: "Needs attention", figure: String(bad),
        note: `${c.down} down · ${c.warn} warning` },
      { label: promoted ? `Median from ${place(promoted)}` : "Median response",
        figure: fleetMedian === null ? "—" : `${fleetMedian}<span class="unit"> ms</span>`,
        note: latencyNote || "responding sites" },
      { label: "Soonest certificate", figure: soonest ? `${soonest.ssl_days_left}<span class="unit"> d</span>` : "—",
        note: soonest ? soonest.host : "no certificates read" },
      { label: "Soonest renewal", figure: renewal ? `${renewal.domain_days_left}<span class="unit"> d</span>` : "—",
        note: renewal
          ? renewal.host + (unknown ? ` · ${unknown} unpublished` : "")
          : "no registry data" },
    ].map((t) => `<div class="tile">
        <p class="eyebrow">${t.label}</p>
        <p class="figure tnum">${t.figure}</p>
        <p class="note mono">${esc(t.note)}</p>
      </div>`).join("");

    // ledger
    let sites = s.sites.slice();
    const q = state.q.trim().toLowerCase();
    if (q) sites = sites.filter((x) => x.domain.toLowerCase().includes(q));
    if (state.onlyIssues) sites = sites.filter((x) => x.status !== "up");
    sites.sort((a, b) =>
      state.sort === "name"    ? a.domain.localeCompare(b.domain)
    : state.sort === "latency" ? (b.ms ?? -1) - (a.ms ?? -1)
    : state.sort === "cert"    ? (a.ssl_days_left ?? 9e3) - (b.ssl_days_left ?? 9e3)
    : (RANK[a.status] - RANK[b.status]) || a.domain.localeCompare(b.domain));

    $("#rows").innerHTML = sites.length
      ? sites.map(row).join("")
      : `<div class="empty">No sites match “${esc(state.q)}”.</div>`;

    wireRows();
    renderTrend();

    const broken = Object.entries(s.probes || {}).filter(([, p]) => !p.ok);
    const note = $("#probe-note");
    note.hidden = broken.length === 0;
    if (broken.length) {
      note.innerHTML = broken.map(([name, p]) =>
        `<span>Vantage point <b>${esc(name)}</b> is not reporting — ${esc(p.error || "unknown")}. `
        + `Response times below are from the main checker only.</span>`).join("");
    }

    renderChanges();

    const n = state.history.runs.length;
    $("#runs-note").innerHTML = n
      ? `<b>${n}</b> ${n === 1 ? "check" : "checks"} recorded${state.live ? "" : " in this snapshot"}.`
      : "";
  }

  function renderChanges() {
    const recent = state.events.slice(-12).reverse();
    $("#changes").hidden = recent.length === 0;
    if (!recent.length) return;
    $("#changelist").innerHTML = recent.map((e) => `<li>
      <span class="mono">${esc(e.domain)}</span>
      <span class="arrow">${esc(LABEL[e.from] || e.from)} →</span>
      <span class="to" data-s="${esc(e.to)}">${esc(LABEL[e.to] || e.to)}</span>
      <span class="why">${esc(e.note || "")}</span>
      <span class="when" title="${esc(clock(e.t))}">${esc(ago(e.t))}</span>
    </li>`).join("");
  }

  function row(x) {
    const runs = runsFor(x.domain);
    const recent = runs.slice(-SLOTS);

    // Height is a second channel alongside colour, so the strip still reads
    // for colour-blind viewers and in greyscale print.
    const H = { up: 11, warn: 18, down: 26 };
    const bars = recent.map((r, i) => `<span class="bar" data-s="${r.s}" style="height:${H[r.s]}px"
        data-i="${runs.length - recent.length + i}" data-d="${esc(x.domain)}"></span>`).join("")
      || `<span class="strip-empty">no checks yet</span>`;

    // Only checks that actually answered carry a response time — the "15004 ms"
    // of a timeout is the timeout, not a measurement.
    const answered = recent.filter((r) => r.s !== "down");
    const color = x.status === "warn" ? "var(--warn)" : "var(--up)";
    const spark = x.status === "down" ? "" : sparkline(answered, color, 62, 22);

    const d = x.ssl_days_left;
    const certState = d === null || d === undefined ? null
      : d < 0 ? "down" : d <= 7 ? "down" : d <= 21 ? "warn" : "up";
    const reg = typeof x.domain_days_left === "number" ? `${x.domain_days_left} days` : null;
    const cert = certState === null
      ? `<div class="cert none">no certificate read</div>`
      : `<div class="cert" data-expires="${esc(x.ssl_expires || "")}" data-issuer="${esc(x.ssl_issuer || "")}"
              data-reg="${esc(reg || "")}" data-registrar="${esc(x.domain_registrar || "")}">
           <div class="cert-top">
             <span class="days tnum mono">${d < 0 ? "expired" : d + " days"}</span>
             <span class="issuer">${d < 0 ? "" : "of " + CERT_CYCLE}</span>
           </div>
           <div class="meter" data-s="${certState}">
             <i style="width:${Math.max(2, Math.min(100, ((d < 0 ? 0 : d) / CERT_CYCLE) * 100)).toFixed(1)}%"></i>
           </div>
         </div>`;

    return `<div class="lrow site">
      <div><span class="chip" data-s="${x.status}"><span class="dot"></span>${LABEL[x.status]}</span></div>
      <div class="site-name">
        <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.domain)}</a>
        <div class="site-note ${x.status === "up" ? "mono" : ""}" data-s="${x.status}">${esc(
          x.status === "up"
            ? `HTTP ${x.code}` + (x.final_url
                ? " → " + x.final_url.replace(/^https?:\/\//, "").replace(/\/$/, "")
                : "")
            : (x.issues || [x.note]).join(" · "))}</div>
      </div>
      <div class="checks">
        <div class="strip" role="img" aria-label="Last ${recent.length} checks for ${esc(x.domain)}">${bars}</div>
        ${runs.length ? `<div class="availability"><b>${avail(runs)}</b> available over ${runs.length} check${runs.length === 1 ? "" : "s"}</div>` : ""}
      </div>
      <div class="latency">
        <div class="latency-main">
          <span class="val tnum mono${x.status === "down" ? " muted" : ""}">${
            x.status === "down" ? "no response"
            : typeof x.ms === "number" ? x.ms + " ms" : "—"}</span>
          ${spark}
        </div>
        ${Object.entries(x.vantages || {}).map(([name, v]) => {
          // The headline already *is* this probe's cold reading, so repeating it
          // adds nothing. Its warm reading does: the gap between them is the
          // cold start, which is a different problem with a different fix.
          if (name === x.ms_from) {
            if (typeof v.warm_ms !== "number") return "";
            // Only when the first hit was actually the slower one. A container
            // that happened to be awake already makes the second hit the dearer
            // of the two, and "-221 ms of cold start" is worse than no caption.
            const boot = typeof v.ms === "number" && v.ms > v.warm_ms
              ? v.ms - v.warm_ms : null;
            return `
          <div class="vantage" title="${boot === null ? "already warm" : boot + " ms of that is cold start"}">
            <span class="where">warm</span>
            <b class="mono">${v.warm_ms} ms</b>
          </div>`;
          }
          return `
          <div class="vantage" data-failed="${Boolean(v.error)}">
            <span class="where">${esc(name)}</span>
            <b class="mono">${v.error ? "no response" : (typeof v.ms === "number" ? v.ms + " ms" : "—")}</b>
          </div>`;
        }).join("")}
      </div>
      ${cert}
    </div>`;
  }

  function wireRows() {
    $("#rows").querySelectorAll(".bar[data-i]").forEach((bar) => {
      bar.addEventListener("mouseenter", (evt) => {
        const r = runsFor(bar.dataset.d)[Number(bar.dataset.i)];
        if (!r) return;
        showTip(evt, `<b>${LABEL[r.s]}</b>${r.c ? " · HTTP " + r.c : ""}`
          + `${typeof r.ms === "number" ? " · " + r.ms + " ms" : ""}`
          + `<br><span class="k">${esc(clock(r.t))}</span>`);
      });
      bar.addEventListener("mouseleave", hideTip);
    });
    $("#rows").querySelectorAll(".cert[data-expires]").forEach((cell) => {
      const iso = cell.dataset.expires;
      if (!iso) return;
      cell.addEventListener("mouseenter", (evt) =>
        showTip(evt, `<span class="k">Certificate expires</span><br><b>${esc(clock(iso))}</b>`
          + (cell.dataset.issuer ? `<br><span class="k">Issued by ${esc(cell.dataset.issuer)}</span>` : "")
          + (cell.dataset.reg
              ? `<br><br><span class="k">Domain renews in</span><br><b>${esc(cell.dataset.reg)}</b>`
                + (cell.dataset.registrar ? `<br><span class="k">via ${esc(cell.dataset.registrar)}</span>` : "")
              : "")));
      cell.addEventListener("mouseleave", hideTip);
    });
  }

  /* ---- controls ------------------------------------------------------ */
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("#issues").addEventListener("click", (e) => {
    state.onlyIssues = !state.onlyIssues;
    e.currentTarget.setAttribute("aria-pressed", String(state.onlyIssues));
    render();
  });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });

  load();
  setInterval(() => { if (state.live) load(); }, 60000);
})();
</script>
</body>
</html>
